<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#121417">
<title>사마 웅진경영</title>
<meta name="description" content="사마(斯麻) 웅진경영 — 무령왕 23년을 23턴으로, 웅진에 건물을 짓고 인재를 모아 나라를 다시 세우는 역사 경영 게임">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Gowun+Batang:wght@400;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
/* 레이아웃: 위 수치 · 가운데 아이소메트릭 웅진 지도 · 아래 명령 막대. 색은 금동·청동녹·옻칠 */
:root {
  --bg: #121417; --panel: #1c2024; --panel2: #23282d; --line: #3a3f45;
  --paper: #ece2cb; --dim: #a9b5a6; --amber: #c9a35a; --green: #7fa792; --cinnabar: #c4553c; --sky: #8fb0d6;
  --f-display: "Nanum Myeongjo", "AppleMyungjo", serif;
  --f-body: "Gowun Batang", "AppleMyungjo", serif;
  --f-han: "Noto Serif TC", "Songti TC", serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--paper); font-family: var(--f-body); font-size: 15px; line-height: 1.6; touch-action: manipulation; overflow: hidden;
  background-image: radial-gradient(ellipse at 50% 30%, #23302c 0%, var(--bg) 70%); }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); max-width: 980px; margin: 0 auto; }

/* 위: 연도와 수치 */
.top { display: grid; gap: 6px; padding: 8px 0 4px; }
.yearbar { display: flex; align-items: center; gap: 10px; }
.logo { font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; margin: 0; white-space: nowrap; }
.logo span { font-family: var(--f-han); color: var(--amber); margin-right: .25em; }
.year { flex: 1; min-width: 0; font-size: .82rem; color: var(--dim); }
.year b { color: var(--paper); font-family: var(--f-display); font-size: .98rem; }
.turnbar { height: 3px; background: var(--panel2); border-radius: 2px; overflow: hidden; margin-top: 3px; }
.turnbar i { display: block; height: 100%; background: var(--amber); }
.ghost { background: rgba(14,16,19,.7); border: 1px solid var(--line); color: var(--dim); border-radius: 4px; padding: 2px 9px; font-size: .78rem; }
.stats { display: grid; grid-template-columns: 1.2fr repeat(4, 1fr); gap: 6px; background: rgba(14,16,19,.72); border: 1px solid rgba(201,163,90,.25); border-radius: 6px; padding: 6px 10px; }
.rels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: rgba(14,16,19,.55); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; }
.st { min-width: 0; position: relative; }
.st .k { display: block; font-size: .66rem; color: var(--dim); white-space: nowrap; }
.st .v { display: flex; align-items: center; gap: 4px; font-size: .9rem; font-variant-numeric: tabular-nums; }
.st .gold-n { font-family: var(--f-display); font-weight: 800; color: #e0c27a; }
.st .gold-n small { font-family: var(--f-body); font-weight: 400; font-size: .68rem; color: var(--dim); margin-left: 2px; }
.st .d { position: absolute; top: 0; right: 0; font-size: .62rem; }
.up { color: var(--green); } .down { color: var(--cinnabar); }
.ics { display: grid; grid-template-columns: repeat(5, minmax(0, 14px)); gap: 1px; width: 100%; }
.slot { position: relative; display: block; width: 100%; aspect-ratio: 1; max-width: 14px; }
.gl { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }
.gl.off { opacity: .2; filter: none; }
.g-power { color: #e2b85c; } .g-army { color: #b9c2c0; } .g-gold { color: #c9944a; } .g-nobles { color: #8fb79f; }
.g-people { color: #d9b25a; } .g-buddha { color: #e6a9b4; } .g-yang { color: #d98a5b; } .g-wa { color: #8fb0d6; }
.coin { width: 15px; height: 15px; color: #c9944a; flex: 0 0 auto; }

/* 가운데: 지도 */
.mapwrap { position: relative; min-height: 0; overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.tile { cursor: pointer; }
.tile:hover .face { filter: brightness(1.15); }
.sel { fill: none; stroke: #f3d27a; stroke-width: 2; pointer-events: none; }
.lockfog { pointer-events: none; }
.log { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font-size: .78rem; color: var(--dim); pointer-events: none; text-shadow: 0 1px 4px #000; padding: 0 8px; }
.hint { position: absolute; left: 0; right: 0; top: 4px; text-align: center; font-size: .78rem; color: var(--amber); pointer-events: none; text-shadow: 0 1px 4px #000; }

/* 아래: 명령 */
.bottom { display: grid; gap: 6px; padding: 6px 0 8px; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr) 1.4fr; gap: 6px; }
.tab { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 4px; font-size: .86rem; }
.tab.on { border-color: var(--amber); color: var(--amber); }
.next { background: var(--amber); color: #1a1206; border: 0; border-radius: 6px; font-family: var(--f-display); font-weight: 800; font-size: .95rem; }
.next:disabled { opacity: .5; }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; max-height: 40vh; overflow-y: auto; display: grid; gap: 8px; }
.sheet[hidden] { display: none; }
.sheet h3 { margin: 0; font-family: var(--f-display); font-size: .95rem; color: var(--amber); display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.sheet h3 small { font-family: var(--f-body); color: var(--dim); font-weight: 400; font-size: .74rem; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.card { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; display: grid; gap: 2px; font-size: .82rem; line-height: 1.45; min-width: 0; }
.card:hover:not(:disabled) { border-color: var(--amber); }
.card:disabled { opacity: .45; cursor: not-allowed; }
.card b { font-family: var(--f-display); font-size: .9rem; }
.card .cost { color: #e0c27a; font-size: .76rem; }
.card .eff { color: var(--dim); font-size: .74rem; }
.card.person { grid-template-columns: 44px 1fr; align-items: center; gap: 8px; }
.ava { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; background: #2c3136; border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--f-han); color: var(--amber); }
.ava img { width: 140%; height: 140%; object-fit: cover; object-position: 50% 12%; }
.tag { display: inline-block; font-size: .68rem; border: 1px solid currentColor; border-radius: 3px; padding: 0 5px; margin-left: 4px; }

/* 사건 창 */
.modal { position: fixed; inset: 0; z-index: 30; background: rgba(6,7,9,.78); display: grid; place-items: center; padding: 14px; }
.modal[hidden] { display: none; }
.ev { width: min(560px, 100%); max-height: 100%; overflow-y: auto; background: var(--panel); border: 1px solid rgba(201,163,90,.5); border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.ev .pic { position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: #000; }
.ev .pic img.bgi { width: 100%; height: 100%; object-fit: cover; display: block; filter: brightness(.85); }
.ev .pic img.who { position: absolute; bottom: 0; left: 50%; height: 105%; transform: translateX(-50%); filter: drop-shadow(0 6px 18px rgba(0,0,0,.6)); }
.ev .pic::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 55%, var(--panel) 100%); }
.ev .in { padding: 12px 16px 16px; display: grid; gap: 8px; }
.ev .when { font-size: .76rem; color: var(--amber); letter-spacing: .06em; }
.ev h2 { margin: 0; font-family: var(--f-display); font-size: 1.2rem; text-wrap: balance; }
.ev p { margin: 0; }
.ev .note { color: #9fb6cc; font-size: .84rem; border-top: 1px dashed rgba(143,176,214,.35); padding-top: 6px; }
.ev .han { font-family: var(--f-han); font-size: .92rem; color: var(--dim); }
.ev .chs { display: grid; gap: 6px; }
.ev .ch { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; }
.ev .ch:hover:not(:disabled) { border-color: var(--amber); }
.ev .ch:disabled { opacity: .45; cursor: not-allowed; }
.ev .ch small { display: block; color: var(--dim); font-size: .74rem; }
.ev .sum { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .84rem; }
.relics { display: flex; flex-wrap: wrap; gap: 5px; }
.relics span { font-size: .76rem; padding: 1px 7px; border-radius: 3px; border: 1px dashed var(--line); color: var(--dim); }
.relics span.on { border-style: solid; border-color: var(--amber); color: var(--amber); }

/* 첫 화면 */
.title { position: fixed; inset: 0; z-index: 40; cursor: pointer; background: #07080a; }
.title[hidden] { display: none; }
.title img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(.7); }
.title .mast { position: absolute; left: 0; right: 0; bottom: 12vh; text-align: center; padding: 0 16px; }
.title .han { font-family: var(--f-han); font-weight: 700; color: var(--amber); font-size: clamp(3rem, 13vw, 6rem); letter-spacing: .16em; line-height: 1.1; text-shadow: 0 2px 24px rgba(0,0,0,.6); }
.title .ko { font-family: var(--f-display); font-weight: 800; font-size: clamp(1rem, 2.6vw, 1.3rem); letter-spacing: .2em; margin-top: 8px; text-shadow: 0 1px 10px #000; }
.title .tap { margin-top: 4vh; font-size: .85rem; color: var(--dim); letter-spacing: .2em; animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .title .tap { animation: none; } }
@media (max-width: 520px) {
  .logo b { display: none; }
  .year { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: .74rem; }
  .year b { font-size: .9rem; }
  .stats { grid-template-columns: 1.1fr repeat(4, 1fr); padding: 5px 8px; gap: 4px; }
  .st .k { font-size: .6rem; }
  .tab { font-size: .8rem; }
}
/* 아주 좁은 화면 */
@media (max-width: 400px) {
  .yearbar { gap: 6px; }
  .ghost { padding: 2px 6px; font-size: .7rem; }
  .st .gold-n { white-space: nowrap; font-size: .82rem; }
  .st .gold-n small { display: none; }
  .stats { grid-template-columns: 1fr repeat(4, 1fr); padding: 5px 6px; }
}
.warn { font-size: .8rem; color: #ffb4a3; background: rgba(196,85,60,.15); border-radius: 4px; padding: 4px 8px; }
.bonus { display: grid; gap: 2px; font-size: .78rem; color: #f3d27a; }
.card .warnline { color: #ffb4a3; font-size: .7rem; }
.card .plus { color: #f3d27a; font-size: .72rem; }
.st .k { display: flex; align-items: center; gap: 3px; }
.mini { width: 11px; height: 11px; flex: 0 0 auto; }
.st .n { font-family: var(--f-display); font-weight: 800; font-size: 1rem; color: var(--paper); }
.st .v small { font-size: .66rem; margin-left: 3px; }
.nb { display: block; height: 3px; background: rgba(255,255,255,.08); border-radius: 2px; overflow: hidden; margin-top: 2px; }
.nb i { display: block; height: 100%; background: currentColor; }
.peace { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 3px; background: #e2b85c; color: #1a1206; font-size: .72rem; font-family: var(--f-display); font-weight: 800; }
.guide-t { width: 100%; border-collapse: collapse; font-size: .8rem; }
.guide-t td, .guide-t th { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
.guide-t th { color: var(--amber); font-weight: 700; }
.srcbtn { justify-self: start; background: transparent; border: 1px solid var(--line); color: var(--dim); border-radius: 4px; padding: 2px 10px; font-size: .78rem; }
.srcbox { border-left: 2px solid var(--amber); padding: 4px 10px; display: grid; gap: 4px; background: rgba(0,0,0,.2); }
.srcbox[hidden] { display: none; }
.srcbox .ko { font-size: .86rem; }
.srcbox .from { font-size: .72rem; color: var(--dim); }
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <div class="yearbar">
      <h1 class="logo"><span>斯麻</span><b>웅진경영</b></h1>
      <div class="year" id="year"></div>
      <button class="ghost" id="btn-guide" type="button">가이드</button>
      <button class="ghost" id="btn-help" type="button">도움말</button>
      <button class="ghost" id="btn-new" type="button">처음부터</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="rels" id="rels"></div>
  </div>
  <div class="mapwrap">
    <svg id="map" aria-label="웅진 지도"></svg>
    <div class="hint" id="hint"></div>
    <div class="log" id="log"></div>
  </div>
  <div class="bottom">
    <div class="sheet" id="sheet" hidden></div>
    <div class="tabs">
      <button class="tab" id="tab-build" type="button">건설</button>
      <button class="tab" id="tab-people" type="button">인재</button>
      <button class="tab" id="tab-war" type="button">원정</button>
      <button class="next" id="btn-next" type="button">다음 해 ▶</button>
    </div>
  </div>
</div>
<div class="modal" id="modal" hidden><div class="ev" id="ev"></div></div>
<div class="title" id="title" role="button" tabindex="0" aria-label="게임 시작">
  <img src="assets/bg_tomb.webp" alt="">
  <div class="mast"><div class="han" lang="zh-Hant">斯麻</div><div class="ko">웅진경영 · 무령왕의 스물세 해</div><div class="tap">화면을 누르면 시작합니다</div></div>
</div>

<script>
/* ================= 기본 값 ================= */
const FIRST = 501, TURNS = 23;
const N = 11;                      // 지도 11×11
const TW = 64, TH = 32;            // 마름모 타일 크기
const STATS = ["power", "army", "nobles", "people"];
const RELS = ["yang", "wa", "buddha"];
const NAME = { gold: "재정", power: "왕권", army: "군사력", nobles: "귀족 협력", people: "민심", yang: "양나라 우호", wa: "왜 우호", buddha: "불심" };

/* 지형: 금강은 남쪽 가장자리, 공산성 언덕은 왕궁 북서쪽 */
function terrain(x, y) {
  if (y === N - 1 || (x === N - 1 && y >= 6)) return "river";
  if ((x === 4 && y === 4) || (x === 4 && y === 5) || (x === 5 && y === 4)) return "hill";
  return "land";
}
/* 처음엔 금강가 웅진 둘레만. 북쪽 성을 되찾을 때마다 북쪽(위)으로 땅이 넓어진다 */
const RING = [4, 3, 2, 0];
const opened = (x, y) => x >= RING[S.ring] && y >= RING[S.ring];
const nearRiver = (x, y) => [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => { const a = x + dx, b = y + dy; return a >= 0 && b >= 0 && a < N && b < N && terrain(a, b) === "river"; });

/* ================= 건물 ================= */
const B = {
  paddy:   { name: "논", cost: 12, on: "land", eff: { gold: 3, people: 1 }, desc: "곡식을 거둬 나라 살림과 민심을 채운다. 금강 옆에 지으면 더 많이 거둔다." },
  levee:   { name: "제방", cost: 20, on: "land", river: true, eff: { people: 1 }, desc: "강가에만 지을 수 있다. 큰물을 막고, 바로 옆 논이 더 거두게 한다." },
  granary: { name: "창고", cost: 20, on: "land", eff: { gold: 1, people: 1 }, desc: "흉년이 들면 창고를 열어 백성을 먹인다." },
  manor:   { name: "귀족 저택", cost: 30, on: "land", eff: { nobles: 3, gold: 2, power: -1 }, desc: "대성8족을 웅진에 붙잡아 둔다." },
  barracks:{ name: "군영", cost: 35, on: "land", eff: { army: 4, gold: -2 }, desc: "군사를 기른다. 해마다 재정이 든다." },
  wall:    { name: "성벽", cost: 30, on: "any", eff: { army: 1 }, desc: "고구려·말갈의 침입을 막는다. 언덕에도 쌓을 수 있다." },
  temple:  { name: "절", cost: 30, on: "land", eff: { people: 2, nobles: 1 }, desc: "누구의 조상도 아닌 부처 앞에 모두가 함께 절한다. 불심이 쌓인다." },
  harbor:  { name: "나루", cost: 40, on: "land", river: true, eff: { gold: 2, yang: 2, wa: 2 }, desc: "강가에만 지을 수 있다. 양나라와 왜를 오가는 배가 닿는다. 지은 나루를 누르면 교역선을 보낼 수 있다." },
  kiln:    { name: "벽돌 가마", cost: 50, on: "land", need: () => S.yang >= 40, needText: "양나라 우호가 쌓여야 장인이 온다", eff: { yang: 1 }, desc: "남조식 벽돌을 굽는다. 이 가마가 있어야 왕릉을 벽돌로 쌓을 수 있다." },
  smith:   { name: "금공방", cost: 50, on: "land", need: () => S.gold >= 0, eff: { power: 2, gold: -1 }, desc: "다리(多利) 같은 금속 장인들이 금관 꾸미개와 장신구를 만든다." },
  road:    { name: "도로", cost: 3, on: "any", flat: true, eff: {}, desc: "건물은 왕궁과 이어진 도로에 맞닿아 있어야 일한다. 사람들이 이 길을 오간다." },
  palace:  { name: "왕궁", cost: 0, fixed: true, eff: { power: 1, gold: 2 }, desc: "웅진 왕궁. 옮기거나 허물 수 없다." }
};
const BUILD_LIST = ["road", "paddy", "levee", "granary", "manor", "barracks", "wall", "temple", "harbor", "kiln", "smith"];
const upCost = (b, lv) => Math.round(B[b].cost * (lv + 1));
/* 궁 주변(왕궁에서 두 칸 안)에 지으면 더 좋아지는 건물 */
const PALACE = [5, 5];
const nearPalace = (x, y) => Math.max(Math.abs(x - PALACE[0]), Math.abs(y - PALACE[1])) <= 2 && !(x === PALACE[0] && y === PALACE[1]);
const COURT = {
  manor:    { eff: { nobles: 2, power: 1 }, why: "조정 가까이 사는 귀족" },
  smith:    { eff: { power: 1 }, why: "왕실 공방" },
  temple:   { eff: { nobles: 1, power: 1 }, why: "왕실 원찰" },
  barracks: { eff: { power: 1 }, why: "왕궁 호위군" },
  wall:     { eff: { army: 2 }, why: "궁성 방비" },
  granary:  { eff: { gold: 1 }, why: "나라 창고" }
};
/* 나란히(맞닿게) 지으면 생기는 짝 효과 */
const COMBO = [
  { a: "paddy", b: "levee", eff: { gold: 1, people: 1 }, why: "제방이 지키는 논" },
  { a: "paddy", b: "granary", eff: { people: 1 }, why: "거둔 곡식을 바로 창고에" },
  { a: "barracks", b: "wall", eff: { army: 2 }, why: "성벽을 지키는 군영" },
  { a: "temple", b: "manor", eff: { nobles: 1 }, why: "귀족이 시주하는 절" },
  { a: "kiln", b: "harbor", eff: { yang: 1 }, why: "남조 장인이 오가는 가마" },
  { a: "smith", b: "kiln", eff: { gold: 1 }, why: "불을 함께 쓰는 공방" },
  { a: "temple", b: "temple", eff: { people: 1 }, why: "절이 모인 거리" }
];
function bonuses(x, y) {
  const t = S.map[y][x]; if (!t) return [];
  const list = [];

/* 도로망: 왕궁에서 도로를 따라 닿는 칸들. 성벽·제방은 도로 없이도 제 몫을 한다 */
const NOROAD = new Set(["palace", "road", "wall", "levee"]);
const N4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
function reach() {
  const seen = new Set(), q = [PALACE];
  while (q.length) {

    for (const [dx, dy] of N4) {

}
let REACH = null;
function works(x, y) {

}

  for (const k in b.eff) out[k] = b.eff[k] * t.lv;

  if (S.peace) {

    sum.people = Math.max(sum.people, 0);
  }

}

let modalQueue = [], modalOpen = false;
const busy = () => modalOpen || !$("title").hidden;
function show(ev) { modalQueue.push(ev); if (!modalOpen) nextModal(); }
function nextModal() {
  const ev = modalQueue.shift();
  if (!ev) { modalOpen = false; $("modal").hidden = true; return; }
  modalOpen = true; $("modal").hidden = false;
  const sum = ev.sum ? Object.entries(ev.sum).filter(([, v]) => v).map(([k, v]) => `<span class="${v > 0 ? "up" : "down"}">${NAME[k]} ${v > 0 ? "+" + v : v}</span>`).join("") : "";
  $("ev").innerHTML = `${ev.bg ? `<div class="pic"><img class="bgi" src="assets/bg_${ev.bg}.webp" alt="">${ev.who ? `<img class="who" src="assets/char_${ev.who}.png" alt="">` : ""}</div>` : ""}
    <div class="in"><div class="when">${esc(ev.when || "")}</div><h2>${esc(ev.title)}</h2>
    ${(ev.text || []).map(t => `<p>${esc(t)}</p>`).join("")}
    ${ev.src ? `<button class="srcbtn" id="srcbtn" type="button">사료 보기 · ${esc(ev.src[0])}</button><div class="srcbox" id="srcbox" hidden><p class="han" lang="zh-Hant">${esc(ev.src[1])}</p><p class="ko">${esc(ev.src[2])}</p><p class="from">${esc(ev.src[3])}</p></div>` : ""}
    ${ev.note ? `<p class="note">${esc(ev.note)}</p>` : ""}
    ${sum ? `<div class="sum">${sum}</div>` : ""}
    ${ev.html || ""}
    <div class="chs">${(ev.choices || [{ label: "계속" }]).map((c, i) => {
      const off = c.need && !c.need();
      return `<button class="ch" data-i="${i}" type="button"${off ? " disabled" : ""}>${esc(c.label)}${c.sub || off ? `<small>${esc(off ? c.needText || "" : c.sub)}</small>` : ""}</button>`;
    }).join("")}</div></div>`;
  $("ev").scrollTop = 0;
  if ($("srcbtn")) $("srcbtn").onclick = () => { $("srcbox").hidden = !$("srcbox").hidden; };
  $("ev").querySelectorAll("[data-i]").forEach(b => b.onclick = () => {
    const c = (ev.choices || [{ label: "계속" }])[+b.dataset.i];
    let d = {};
    if (c.eff) d = apply(typeof c.eff === "function" ? c.eff() : c.eff);
    if (c.act) c.act();
    save(); paintAll();
    if (c.then) modalQueue.unshift(typeof c.then === "function" ? c.then(d) : c.then);
    else if (c.res) modalQueue.unshift({ bg: ev.bg, who: ev.who, when: ev.when, title: ev.title, text: [].concat(typeof c.res === "function" ? c.res() : c.res), sum: d });
    nextModal();
  });
}

  if (p.length) { const [x, y] = p[Math.floor(Math.random() * p.length)]; S.map[y][x] = null; }
}
function raid(r) {
  const def = S.army + count("wall") * 10, ok = def >= r.str;
  let d;
  if (ok) d = apply({ power: 4, army: -4 });
  else {
    d = apply({ people: -10, gold: -20, army: -8, power: -4 });
    const cells = []; for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const t = S.map[y][x]; if (t && t.b !== "palace" && t.b !== "road") cells.push(t); }
    if (cells.length) { const t = cells[Math.floor(Math.random() * cells.length)]; t.lv > 1 ? t.lv-- : (S.map.forEach(r2 => r2.forEach((c, i) => { if (c === t) r2[i] = null; }))); }
  }
  return { bg: ok ? "march" : "fire", when: `${year()}년 · ${r.place}`, title: ok ? `${r.who}의 침입을 막다` : `${r.who}에게 뚫리다`,
    text: [ok ? `${jo(r.who, "이/가")} ${jo(r.place, "을/를")} 쳐들어왔지만, 성벽과 군사가 막아 냈다. (방어 ${def} ≥ 적 ${r.str})` : `${jo(r.who, "이/가")} ${jo(r.place, "을/를")} 뚫고 들어와 마을을 불태웠다. 건물 하나가 무너졌다. (방어 ${def} < 적 ${r.str})`],
    note: "방어력은 군사력에 성벽 한 단계마다 10을 더한 값이다.", sum: d };
}

function nextYear() {
  if (busy()) return;
  openSheet("", null); sel = null;
  const inc = income();
  const d = apply(inc);
  S.last = d;
  const y = year();
  const queue = [{ bg: null, when: `${y}년 결산`, title: `무령왕 ${S.turn + 1}년이 저물다`, text: [incomeText(inc)], sum: d }];
  S.turn++; S.warDone = false; S.tradeDone = false;
  const wasPeace = S.peace;
  S.peace = S.people >= 90;
  if (S.people <= 0) return endGame("revolt", queue);
  if (S.nobles <= 0 || S.power <= 0) return endGame("coup", queue);
  if (S.turn >= TURNS) return endGame("tomb", queue);
  const ny = year();
  if (S.peace && !wasPeace) queue.push({ bg: "river", when: `${ny}년`, title: "태평성대", text: ["백성들이 배불리 먹고 노래를 부른다. 웅진의 들판마다 풍년이 들었다. 민심이 90 이상인 동안 모든 생산이 1.3배가 되고, 백성이 떠나지 않는다."], note: "민심이 90 아래로 떨어지면 태평성대가 끝난다." });
  if (!S.peace && wasPeace) queue.push({ bg: "field", when: `${ny}년`, title: "태평성대가 저물다", text: ["민심이 흔들리기 시작했다. 풍년의 노래가 그쳤다."] });
  if (RAIDS[ny]) queue.push(raid(RAIDS[ny]));
  if (HISTORY[ny]) queue.push(HISTORY[ny]());
  else if (!RAIDS[ny] && Math.random() < .55) queue.push(RANDOM[Math.floor(Math.random() * RANDOM.length)]());
  S.log = `${ny}년이 밝았다.`;
  save(); paintAll();
  queue.forEach(show);
}
function incomeText(inc) {
  const b = S.map.flat().filter(t => t && t.b !== "road").length;
  return `건물 ${b}채와 인재 ${S.hired.length}명으로 한 해를 꾸렸다. 백성과 귀족은 돌보지 않으면 멀어지고, 군사는 기르지 않으면 줄어든다.`;
}
